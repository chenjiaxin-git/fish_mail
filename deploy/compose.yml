name: ${COMPOSE_PROJECT_NAME:-fishmall}
services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0.44}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fishmall
      MYSQL_USER: fishmall
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--default-time-zone=+08:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u$$MYSQL_USER -D fishmall -e 'select 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]
  minio:
    image: ${MINIO_IMAGE:-fishmall-minio:2025-09-07}
    build: {context: ., dockerfile: minio.Dockerfile}
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]
  minio-init:
    image: ${MINIO_MC_IMAGE:-fishmall-mc:2025-08-13}
    build: {context: ., dockerfile: mc.Dockerfile}
    depends_on:
      minio: {condition: service_healthy}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set dedicated MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set dedicated MINIO_SECRET_KEY}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./scripts/minio-init.sh:/init.sh:ro
      - ./config/minio-policy.json:/policy.json:ro
    networks: [internal]
  backend:
    image: ${BACKEND_IMAGE:-fishmall-backend:delivery-v1}
    build: ../backend
    stop_grace_period: 70s
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/config/notifications.yml
      MYSQL_URL: jdbc:mysql://mysql:3306/fishmall?serverTimezone=Asia/Shanghai&characterEncoding=utf8
      MYSQL_USER: fishmall
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_USER_SECRET: ${JWT_USER_SECRET:?set independent JWT_USER_SECRET}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?set ADMIN_INITIAL_PASSWORD}
      WECHAT_APPID: ${WECHAT_APPID:?set real WECHAT_APPID before production}
      WECHAT_SECRET: ${WECHAT_SECRET:?set real WECHAT_SECRET before production}
      STORAGE_TYPE: minio
      PRODUCT_IMAGE_DIR: /data/legacy-images
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: fishmall-images
      NOTIFICATION_ENABLED: ${NOTIFICATION_ENABLED:-false}
      NOTIFICATION_MINIPROGRAM_STATE: ${NOTIFICATION_MINIPROGRAM_STATE:-formal}
      WECHAT_PAY_ENABLED: ${WECHAT_PAY_ENABLED:-false}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_MERCHANT_SERIAL_NO: ${WECHAT_PAY_MERCHANT_SERIAL_NO:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: /run/keys/merchant-private.pem
      WECHAT_PAY_PUBLIC_KEY_ID: ${WECHAT_PAY_PUBLIC_KEY_ID:-}
      WECHAT_PAY_PUBLIC_KEY_PATH: /run/keys/wechat-public.pem
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      ORDER_TIMEOUT_CLOSE_ENABLED: ${ORDER_TIMEOUT_CLOSE_ENABLED:-true}
    volumes:
      - legacy_images:/data/legacy-images:ro
      - ${CONFIG_DIR:-./config}:/config:ro
      - ${PAYMENT_KEY_DIR:-./secrets}:/run/keys:ro
    networks: [internal,egress]
  nginx:
    image: ${ADMIN_IMAGE:-fishmall-admin:delivery-v1}
    build: ../admin
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports: ["${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80", "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERT_DIR:-./certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [internal,egress]
networks:
  internal: {internal: true}
  egress: {}
volumes:
  mysql_data: {}
  minio_data: {}
  legacy_images:
    name: ${COMPOSE_PROJECT_NAME:-fishmall}_legacy_images
