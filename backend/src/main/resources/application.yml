server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: fishmall-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/fishmall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET time_zone = '+08:00'"
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL

product:
  image-dir: ${PRODUCT_IMAGE_DIR:./data/product-images}
  image-base-url: ${PRODUCT_IMAGE_BASE_URL:/uploads/products}
  image-max-bytes: ${PRODUCT_IMAGE_MAX_BYTES:5242880}

order:
  payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:60}
  confirm-timeout-minutes: ${ORDER_CONFIRM_TIMEOUT_MINUTES:1440}
  timeout-close-enabled: ${ORDER_TIMEOUT_CLOSE_ENABLED:true}
  timeout-close-delay-ms: ${ORDER_TIMEOUT_CLOSE_DELAY_MS:30000}
  timeout-close-batch-size: ${ORDER_TIMEOUT_CLOSE_BATCH_SIZE:50}
  timeout-close-max-batches: ${ORDER_TIMEOUT_CLOSE_MAX_BATCHES:10}
  timeout-close-budget-ms: ${ORDER_TIMEOUT_CLOSE_BUDGET_MS:20000}

admin:
  username: ${ADMIN_USERNAME:admin}
  initial-password: ${ADMIN_INITIAL_PASSWORD:}
  jwt-secret: ${JWT_SECRET:}
  token-ttl-seconds: ${ADMIN_TOKEN_TTL_SECONDS:28800}

user:
  jwt-secret: ${JWT_USER_SECRET:}
  token-ttl-seconds: ${USER_TOKEN_TTL_SECONDS:604800}

wechat:
  app-id: ${WECHAT_APPID:}
  app-secret: ${WECHAT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

wechat-pay:
  enabled: ${WECHAT_PAY_ENABLED:false}
  app-id: ${WECHAT_APPID:}
  mch-id: ${WECHAT_PAY_MCH_ID:}
  merchant-serial-no: ${WECHAT_PAY_MERCHANT_SERIAL_NO:}
  private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
  public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}
  public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
  api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
  notify-url: ${WECHAT_PAY_NOTIFY_URL:}
  timeout-ms: ${WECHAT_PAY_TIMEOUT_MS:5000}

logging:
  level:
    com.wechat.pay.java: WARN

notification:
  enabled: ${NOTIFICATION_ENABLED:false}
  batch-size: ${NOTIFICATION_BATCH_SIZE:20}
  max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
  timeout-ms: ${NOTIFICATION_TIMEOUT_MS:5000}
  max-age-minutes: ${NOTIFICATION_MAX_AGE_MINUTES:1440}
  miniprogram-state: ${NOTIFICATION_MINIPROGRAM_STATE:formal}

storage:
  type: ${STORAGE_TYPE:local}
  minio:
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:fishmall-images}
    prefix: products/
